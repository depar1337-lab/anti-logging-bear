name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    strategy:
      matrix:
        arch: [x64, x86]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: ${{ matrix.arch }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r packaging/requirements-win7.txt
      - run: pip install --no-deps .
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/BarryBear.spec
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/BarryBear/* -DestinationPath dist/BarryBear-${{ matrix.arch }}-portable.zip
      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" packaging/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*-setup.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: AppleSilicon
            arch: arm64
            target: "11.0"
          - runner: macos-15-intel
            name: Intel
            arch: x86_64
            target: "10.15"
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install . pyinstaller
      - name: YARA for the minimum macOS
        run: |
          platform="macosx_${MACOSX_DEPLOYMENT_TARGET/./_}_${{ matrix.arch }}"
          python -m pip download --only-binary :all: --no-deps --python-version 3.12 --platform "$platform" --dest yara-wheel yara-python
          python -m pip install yara-wheel/*.whl
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/BarryBear.spec
      - name: Check minimum macOS
        run: python packaging/macos_minimum.py "dist/Barry Bear.app" "$MACOSX_DEPLOYMENT_TARGET" tkinterdnd2/
      - name: Smoke test
        run: |
          echo hello > note.txt
          "dist/Barry Bear.app/Contents/MacOS/Barry Bear" note.txt --no-av
      - name: Disk image
        run: |
          mkdir -p dmg
          cp -R "dist/Barry Bear.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Barry Bear" -srcfolder dmg -ov -format UDZO "dist/BarryBear-macOS-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
