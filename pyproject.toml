[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antiloggingbear"
version = "1.3.0"
description = "Checks downloads for keyloggers and malware before you unzip them."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Priest" }]
requires-python = ">=3.8"
dependencies = [
    "pefile>=2023.2.7",
    "oletools>=0.60",
    "LnkParse3>=1.2",
    "Pillow>=9.0",
    "pystray>=0.19; sys_platform == 'win32'",
    "tkinterdnd2>=0.3",
    "dnfile>=0.15",
    "rarfile>=4.0",
    "py7zr>=0.20.6,<0.21",
]

[project.optional-dependencies]
yara = ["yara-python>=4.2"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
antiloggingbear = "antiloggingbear.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
antiloggingbear = ["assets/*.png", "assets/*.ico", "assets/*.icns", "rules/*.yar", "rules/forge.bin", "rules/forge-compiled.bin", "bin/*"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
pythonpath = ["src"]
